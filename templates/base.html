{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ APP_NAME }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="icon" href="{% static 'favicon.ico' %}">

    {% if tenant_school %}
    <style>
    :root {
        --tenant-primary: {{ tenant_school.primary_color|default:"#2563eb" }};
        --tenant-secondary: {{ tenant_school.secondary_color|default:"#0f172a" }};
        --tenant-accent: {{ tenant_school.accent_color|default:"#22c55e" }};
    }

    .btn-primary {
        background-color: var(--tenant-primary) !important;
        border-color: var(--tenant-primary) !important;
    }

    .sidebar {
        background: var(--tenant-secondary) !important;
    }

    .stat-card h2,
    .text-primary {
        color: var(--tenant-primary) !important;
    }
    </style>
    {% endif %}

    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

<button class="mobile-menu-btn" id="mobileMenuBtn">
    ☰
</button>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="layout">
    {% include "partials/sidebar.html" %}

    <main class="main-content">
        {% include "partials/navbar.html" %}
        {% include "partials/messages.html" %}

        <div class="container-fluid py-4">
            {% block content %}{% endblock %}
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const menuBtn = document.getElementById("mobileMenuBtn");
    const sidebar = document.querySelector(".sidebar");
    const overlay = document.getElementById("sidebarOverlay");

    if (menuBtn && sidebar && overlay) {

        menuBtn.addEventListener("click", function () {
            sidebar.classList.toggle("sidebar-open");
            overlay.classList.toggle("active");
        });

        overlay.addEventListener("click", function () {
            sidebar.classList.remove("sidebar-open");
            overlay.classList.remove("active");
        });

    }
});
</script>

<script>
window.MathJax = {
    tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    svg: {
        fontCache: 'global'
    }
};
</script>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

{% block extra_js %}{% endblock %}
</body>
</html>
