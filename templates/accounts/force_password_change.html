{% extends "base.html" %}

{% block content %}
<div class="content-card" style="max-width:650px; margin:auto;">
    <h3 class="fw-bold mb-3">Change Your Password</h3>

    <p class="text-muted">
        For security, you must change your temporary password before continuing.
    </p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-primary">
            Change Password
        </button>
    </form>
</div>
{% endblock %}
