{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | Mutafs EduPortal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --blue:   #2563eb;
            --indigo: #6366f1;
            --glass:  rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.13);
        }

        body {
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            background: #020617;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            overflow-x: hidden;
        }

        /* ── Background mesh ── */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 60% at 20% 30%, rgba(37,99,235,0.18) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 75%, rgba(99,102,241,0.13) 0%, transparent 55%);
        }

        .bg-mesh::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        /* ── Card ── */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 44px 42px 40px;
            box-shadow:
                0 4px 24px rgba(0,0,0,0.28),
                0 32px 80px rgba(0,0,0,0.38),
                inset 0 1px 0 rgba(255,255,255,0.14);
            animation: cardIn .7s cubic-bezier(.22,.68,0,1.2) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(26px) scale(0.97); }
            to   { opacity: 1; transform: none; }
        }

        /* top accent line */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            border-radius: 32px 32px 0 0;
            background: linear-gradient(90deg, var(--blue), var(--indigo));
        }

        /* ── Icon ── */
        .lock-icon {
            width: 58px; height: 58px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(37,99,235,0.25), rgba(99,102,241,0.20));
            border: 1px solid rgba(96,165,250,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 20px;
        }

        /* ── Heading ── */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            text-align: center;
            margin-bottom: 8px;
            line-height: 1.15;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        /* ── Divider ── */
        .divider {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.10);
            margin-bottom: 28px;
        }

        /* ── Label ── */
        .field-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        /* ── Input — override Django's {{ form.as_p }} ── */
        .card p { margin-bottom: 22px; }

        .card input[type="email"],
        .card input[type="text"] {
            width: 100% !important;
            background: rgba(255,255,255,0.08) !important;
            border: 1px solid rgba(255,255,255,0.18) !important;
            border-radius: 14px !important;
            padding: 13px 16px !important;
            color: #fff !important;
            font-family: 'DM Sans', sans-serif !important;
            font-size: 14.5px !important;
            outline: none !important;
            transition: border-color .2s, box-shadow .2s, background .2s !important;
            -webkit-appearance: none !important;
        }

        .card input[type="email"]:focus,
        .card input[type="text"]:focus {
            border-color: #60a5fa !important;
            box-shadow: 0 0 0 3px rgba(96,165,250,0.22) !important;
            background: rgba(255,255,255,0.12) !important;
        }

        .card input::placeholder { color: #475569 !important; }

        .card input:-webkit-autofill,
        .card input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px rgba(15,23,42,0.95) inset !important;
            -webkit-text-fill-color: #fff !important;
            caret-color: #fff !important;
        }

        /* hide Django's default <label> inside form.as_p since we'll use our own */
        .card p > label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #e2e8f0;
            margin-bottom: 7px;
        }

        /* ── Submit button ── */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--blue) 0%, var(--indigo) 100%);
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: transform .22s ease, box-shadow .22s ease;
            box-shadow: 0 6px 20px rgba(37,99,235,0.38);
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, transparent 100%);
            pointer-events: none;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(37,99,235,0.50);
        }

        .btn-submit:active { transform: translateY(0); }

        /* ── Back link ── */
        .back-row {
            text-align: center;
            margin-top: 22px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: color .2s;
        }

        .back-link:hover { color: #93c5fd; }

        /* ── Help note ── */
        .help-note {
            margin-top: 24px;
            padding: 14px 16px;
            background: rgba(37,99,235,0.10);
            border: 1px solid rgba(37,99,235,0.22);
            border-radius: 14px;
            font-size: 13px;
            color: #93c5fd;
            line-height: 1.6;
            text-align: center;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .card { padding: 32px 24px 28px; border-radius: 24px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="bg-mesh"></div>

<div class="card">

    <div class="lock-icon">🔑</div>

    <h1>Forgot Password?</h1>
    <p class="subtitle">
        No worries. Enter your email address and we'll send you a secure reset link right away.
    </p>

    <hr class="divider">

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn-submit" type="submit">
            Send Reset Link &nbsp;→
        </button>
    </form>

    <div class="help-note">
        Check your spam folder if you don't see the email within a few minutes.
    </div>

    <div class="back-row">
        <a href="{% url 'login' %}" class="back-link">← Back to Login</a>
    </div>

</div>

</body>
</html>
