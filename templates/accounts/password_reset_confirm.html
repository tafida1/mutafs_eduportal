{% extends "base.html" %}

{% block content %}
<div class="content-card" style="max-width:600px; margin:auto;">
    <h3 class="fw-bold mb-3">Set New Password</h3>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-primary w-100">
            Save New Password
        </button>
    </form>
</div>
{% endblock %}
