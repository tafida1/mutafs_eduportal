{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold mb-1">Change Password</h3>
        <p class="text-muted mb-0">Update your account password securely.</p>
    </div>
</div>

<form method="post">
    {% csrf_token %}

    <div class="content-card">
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}

                {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <button class="btn btn-primary px-4">Update Password</button>
    </div>
</form>
{% endblock %}
