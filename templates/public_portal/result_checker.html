{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Result Checker | {{ school.name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body class="login-body">

<div class="login-wrapper">
    <div class="login-card shadow-lg">
        <div class="text-center mb-4">
            {% if school.logo %}
                <img src="{{ school.logo.url }}" style="width:80px;height:80px;object-fit:contain;" class="mb-3">
            {% endif %}

            <h3 class="fw-bold">{{ school.name }}</h3>
            <p class="text-muted mb-0">Public Result Checker</p>
            <small>Powered by Mutafs Global Technology</small>
        </div>

        {% include "partials/messages.html" %}

        <form method="post" action="{% url 'public_result_checker_submit' school.portal_subpath %}">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Student Surname</label>
                <input type="text" name="surname" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Result Passkey</label>
                <input type="text" name="passkey" class="form-control text-uppercase" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Session</label>
                <select name="session" class="form-select" required>
                    <option value="">Select Session</option>
                    {% for session in sessions %}
                        <option value="{{ session.id }}">{{ session.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Term</label>
                <select name="term" class="form-select" required>
                    <option value="">Select Term</option>
                    {% for term in terms %}
                        <option value="{{ term.id }}">
                            {{ term.session.name }} — {{ term.get_name_display }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <button class="btn btn-primary w-100 py-2">Check Result</button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'login' %}" class="text-decoration-none">Back to Login</a>
        </div>
    </div>
</div>

</body>
</html>
