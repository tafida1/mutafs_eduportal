{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold mb-1">Result Entry Setup</h3>
        <p class="text-muted mb-0">Choose session, term, class and subject.</p>
    </div>

    <a href="{% url 'result_dashboard' %}" class="btn btn-outline-secondary">Back</a>
</div>

<form method="post">
    {% csrf_token %}

    <div class="content-card">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Session</label>
                {{ form.session }}
            </div>

            <div class="col-md-6">
                <label class="form-label">Term</label>
                {{ form.term }}
            </div>

            <div class="col-md-6">
                <label class="form-label">Class</label>
                {{ form.school_class }}
            </div>

            <div class="col-md-6">
                <label class="form-label">Subject</label>
                {{ form.subject }}
            </div>
        </div>

        <div class="mt-4">
            <button class="btn btn-primary px-4">Continue</button>
        </div>
    </div>
</form>
{% endblock %}
