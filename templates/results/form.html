{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold mb-1">{{ title }}</h3>
        <p class="text-muted mb-0">Result configuration for {{ current_school.name }}.</p>
    </div>

    <a href="{% url back_url %}" class="btn btn-outline-secondary">Back</a>
</div>

<form method="post">
    {% csrf_token %}

    <div class="content-card">
        <div class="row g-3">
            {% for field in form %}
                <div class="col-md-6">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
        </div>

        <div class="mt-4">
            <button class="btn btn-primary px-4">Save</button>
        </div>
    </div>
</form>
{% endblock %}
